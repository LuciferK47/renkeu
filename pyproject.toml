[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-ai"
version = "0.1.0"
description = "Interactive command engine to live-edit LaTeX formatting"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dhirendra + Copilot" }]
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "watchdog>=4.0",
  "pylatexenc>=2.10",
  "google-generativeai>=0.3.0",
  "toml>=0.10.2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.115.0,<0.116.0",  # Pin to known compatible version
  "starlette>=0.40.0,<0.41.0",  # Pin to known compatible version
  "uvicorn>=0.24",
  "python-multipart>=0.0.7",
  "aiofiles>=23.0"  # Move from optional to required for better async performance
]

[project.optional-dependencies]
# Streaming support for SSE responses
streaming = [
  "sse-starlette>=1.6"
]
# Enhanced file I/O and utilities
enhancements = [
  "diff-match-patch>=20200713",
  "structlog>=23.0"
]
# Full installation with all optional features
full = [
  "sse-starlette>=1.6",
  "diff-match-patch>=20200713",
  "structlog>=23.0"
]
# Development and testing
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.21",
  "ruff>=0.1.0",
  "black>=23.0",
  "mypy>=1.5",
  "types-aiofiles>=23.0"
]

[project.scripts]
latex-ai = "latex_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by black)
  "W503",  # line break before binary operator
]

[tool.ruff.isort]
known-first-party = ["latex_ai"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

# Mypy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["venv/", "node_modules/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "fastapi.*,pydantic.*,sse_starlette.*"
ignore_missing_imports = true

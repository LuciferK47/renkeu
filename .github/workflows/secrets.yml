name: Secret scan

# GitHub's own secret scanning is a paid add-on for private repositories, so
# this runs gitleaks over the full history on every push and pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      # --redact keeps a found secret out of the public log lines.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose --no-banner'

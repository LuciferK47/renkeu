name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Use the checked-in .sqlx/ data so query! macros compile without a live DB.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tectonic links these at build time (README "Build & run").
      - name: Install Tectonic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libgraphite2-dev libharfbuzz-dev \
            libicu-dev libfreetype-dev libssl-dev zlib1g-dev

      # Compile tests download the LaTeX support bundle on first run; cache it
      # so CI does not refetch ~40 MB per job.
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The tauri crate is M5 scope and needs the full webkit2gtk stack; it is
      # built in the `desktop` job below, not here.
      - name: Clippy (workspace lints are deny-level)
        run: cargo clippy --workspace --exclude latex-ai-tauri --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --exclude latex-ai-tauri

  supply-chain:
    name: Licenses, advisories, unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check

      - name: cargo machete (unused dependencies)
        run: cargo machete

  contracts:
    name: SSE taxonomy lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # masterplan.md §8.2 hard rule: endpoints may only emit events from the
      # locked taxonomy. Every emission goes through sse::send/sse::event, so
      # checking their first argument covers the whole surface.
      - name: Assert only locked SSE events are emitted
        run: |
          set -euo pipefail
          ALLOWED='progress|step|proposal|applying|compiled|thinking|done|error|awaiting_approval|keepalive'
          # rustfmt splits these calls across lines, so flatten whitespace
          # before matching — a line-oriented grep misses most emissions.
          emitted=$(find crates/latex_ai_server/src -name '*.rs' -exec cat {} + \
            | tr '\n' ' ' \
            | grep -oE 'sse::(send|event)\( *(&tx, *)?"[a-z_]+"' \
            | grep -oE '"[a-z_]+"' | tr -d '"' | sort -u)
          echo "emitted: $(echo "$emitted" | tr '\n' ' ')"
          violations=$(echo "$emitted" | grep -vE "^($ALLOWED)$" || true)
          if [ -n "$violations" ]; then
            echo "Off-taxonomy SSE events emitted (masterplan.md §8.2):"
            echo "$violations"
            exit 1
          fi
          echo "SSE taxonomy OK"

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  desktop:
    name: Tauri shell builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri + Tectonic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libfontconfig1-dev libgraphite2-dev libharfbuzz-dev \
            libicu-dev libfreetype-dev libssl-dev zlib1g-dev

      # The SPA build is the Tauri frontendDist; the crate expects it to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Check the desktop crate compiles
        run: cargo check -p latex-ai-tauri

[package]
name = "latex-ai-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "latex-ai"
path = "src/main.rs"

[dependencies]
latex-ai-compiler = { path = "../compiler" }
latex-ai-core = { path = "../latex_ai_core" }

tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio-stream = "0.1.18"
uuid = { version = "1.23.4", features = ["v4"] }
base64 = "0.22.1"
synctex = { version = "0.1.0", path = "../synctex" }
visual = { version = "0.1.0", path = "../visual" }
image = "0.25.9"
thiserror = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
